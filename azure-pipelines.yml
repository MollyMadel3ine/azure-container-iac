# ------------------------------------------------------------------
# azure-pipelines.yml — container-app-iac
#
# Four stages:
#   Validate : fmt, validate, tfsec (pattern ported from project #1)
#   Build    : docker build, tag with the git SHA, push to ACR
#   Plan     : terraform plan with the new image tag as a variable —
#              app delivery IS an infrastructure change
#   Apply    : gated on the Prod1 environment, applies the reviewed
#              plan, then SMOKE TESTS its own deployment and fails
#              the run if the app doesn't answer with the new tag.
#
# PRs run Validate + Build + Plan. Main runs everything.
# ------------------------------------------------------------------

trigger:
  branches:
    include:
      - main

pr:
  branches:
    include:
      - main

variables:
  - group: terraform-credentials # ARM_CLIENT_ID / SECRET / TENANT_ID / SUBSCRIPTION_ID
  - name: acrName
    value: acrcontainerdemomolly # ← your registry (short name)
  - name: acrServer
    value: acrcontainerdemomolly.azurecr.io
  - name: imageRepo
    value: container-demo
  - name: imageTag
    value: $(Build.SourceVersion) # the git SHA — immutable, traceable
  - name: fullImage
    value: $(acrServer)/$(imageRepo):$(imageTag)

pool:
  vmImage: ubuntu-latest

stages:
  # ----------------------------------------------------------------
  - stage: Validate
    displayName: "Validate & security scan"
    jobs:
      - job: validate
        displayName: "fmt, validate, tfsec"
        steps:
          - script: |
              TF_VERSION=1.9.8
              curl -sSL -o /tmp/terraform.zip https://releases.hashicorp.com/terraform/${TF_VERSION}/terraform_${TF_VERSION}_linux_amd64.zip
              sudo unzip -o /tmp/terraform.zip -d /usr/local/bin
              terraform -version
            displayName: "install terraform (pinned)"

          - script: terraform fmt -check -recursive -diff
            displayName: "terraform fmt"

          - script: terraform init -backend=false
            displayName: "terraform init (no backend)"

          - script: terraform validate
            displayName: "terraform validate"

          - script: |
              TFSEC_VERSION=1.28.11
              curl -sSL -o /tmp/tfsec https://github.com/aquasecurity/tfsec/releases/download/v${TFSEC_VERSION}/tfsec-linux-amd64
              chmod +x /tmp/tfsec
              sudo mv /tmp/tfsec /usr/local/bin/tfsec
              tfsec --version
              tfsec . --no-color
            displayName: "tfsec security scan (pinned)"

  # ----------------------------------------------------------------
  - stage: Build
    displayName: "Build & push image"
    dependsOn: Validate
    jobs:
      - job: build
        displayName: "docker build → ACR"
        steps:
          - script: |
              az login --service-principal \
                --username "$ARM_CLIENT_ID" \
                --password "$ARM_CLIENT_SECRET" \
                --tenant "$ARM_TENANT_ID" --output none
              az acr login --name $(acrName)
            displayName: "authenticate to ACR (as pipeline SP)"
            env:
              ARM_CLIENT_ID: $(ARM_CLIENT_ID)
              ARM_CLIENT_SECRET: $(ARM_CLIENT_SECRET)
              ARM_TENANT_ID: $(ARM_TENANT_ID)

          - script: |
              docker build -t $(fullImage) .
              docker push $(fullImage)
            displayName: "build and push $(imageTag)"

  # ----------------------------------------------------------------
  - stage: Plan
    displayName: "Terraform plan (new image)"
    dependsOn: Build
    jobs:
      - job: plan
        displayName: "plan with SHA-tagged image"
        steps:
          - script: |
              TF_VERSION=1.9.8
              curl -sSL -o /tmp/terraform.zip https://releases.hashicorp.com/terraform/${TF_VERSION}/terraform_${TF_VERSION}_linux_amd64.zip
              sudo unzip -o /tmp/terraform.zip -d /usr/local/bin
            displayName: "install terraform (pinned)"

          - script: terraform init
            displayName: "terraform init (remote state)"
            env:
              ARM_CLIENT_ID: $(ARM_CLIENT_ID)
              ARM_CLIENT_SECRET: $(ARM_CLIENT_SECRET)
              ARM_TENANT_ID: $(ARM_TENANT_ID)
              ARM_SUBSCRIPTION_ID: $(ARM_SUBSCRIPTION_ID)

          - script: terraform plan -input=false -var="container_image=$(fullImage)" -out=$(Build.ArtifactStagingDirectory)/tfplan
            displayName: "terraform plan"
            env:
              ARM_CLIENT_ID: $(ARM_CLIENT_ID)
              ARM_CLIENT_SECRET: $(ARM_CLIENT_SECRET)
              ARM_TENANT_ID: $(ARM_TENANT_ID)
              ARM_SUBSCRIPTION_ID: $(ARM_SUBSCRIPTION_ID)

          - script: terraform show -no-color $(Build.ArtifactStagingDirectory)/tfplan
            displayName: "show plan (for review)"
            env:
              ARM_CLIENT_ID: $(ARM_CLIENT_ID)
              ARM_CLIENT_SECRET: $(ARM_CLIENT_SECRET)
              ARM_TENANT_ID: $(ARM_TENANT_ID)
              ARM_SUBSCRIPTION_ID: $(ARM_SUBSCRIPTION_ID)

          - publish: $(Build.ArtifactStagingDirectory)/tfplan
            artifact: tfplan
            displayName: "publish plan artifact"

  # ----------------------------------------------------------------
  - stage: Apply
    displayName: "Apply & smoke test (gated)"
    dependsOn: Plan
    condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'))
    jobs:
      - deployment: apply
        displayName: "apply reviewed plan, verify deployment"
        environment: Prod1
        strategy:
          runOnce:
            deploy:
              steps:
                - checkout: self

                - download: current
                  artifact: tfplan
                  displayName: "download reviewed plan"

                - script: |
                    TF_VERSION=1.9.8
                    curl -sSL -o /tmp/terraform.zip https://releases.hashicorp.com/terraform/${TF_VERSION}/terraform_${TF_VERSION}_linux_amd64.zip
                    sudo unzip -o /tmp/terraform.zip -d /usr/local/bin
                  displayName: "install terraform (pinned)"

                - script: terraform init
                  displayName: "terraform init"
                  env:
                    ARM_CLIENT_ID: $(ARM_CLIENT_ID)
                    ARM_CLIENT_SECRET: $(ARM_CLIENT_SECRET)
                    ARM_TENANT_ID: $(ARM_TENANT_ID)
                    ARM_SUBSCRIPTION_ID: $(ARM_SUBSCRIPTION_ID)

                - script: terraform apply -input=false $(Pipeline.Workspace)/tfplan/tfplan
                  displayName: "terraform apply (reviewed plan)"
                  env:
                    ARM_CLIENT_ID: $(ARM_CLIENT_ID)
                    ARM_CLIENT_SECRET: $(ARM_CLIENT_SECRET)
                    ARM_TENANT_ID: $(ARM_TENANT_ID)
                    ARM_SUBSCRIPTION_ID: $(ARM_SUBSCRIPTION_ID)

                # ---- The smoke test: the pipeline verifies itself ----
                # Retries accommodate scale-from-zero cold starts.
                - script: |
                    APP_URL=$(terraform output -raw app_url)
                    echo "Smoke testing ${APP_URL}/health for tag $(imageTag)"
                    for i in $(seq 1 10); do
                      RESPONSE=$(curl -s -w "\n%{http_code}" "${APP_URL}/health" || true)
                      BODY=$(echo "$RESPONSE" | head -n -1)
                      CODE=$(echo "$RESPONSE" | tail -n 1)
                      echo "attempt $i: HTTP $CODE"
                      if [ "$CODE" = "200" ] && echo "$BODY" | grep -q "$(imageTag)"; then
                        echo "Smoke test PASSED: app is healthy and running $(imageTag)"
                        exit 0
                      fi
                      sleep 15
                    done
                    echo "Smoke test FAILED: app never answered healthy with the deployed tag"
                    echo "Last body: $BODY"
                    exit 1
                  displayName: "smoke test deployment"
                  env:
                    ARM_CLIENT_ID: $(ARM_CLIENT_ID)
                    ARM_CLIENT_SECRET: $(ARM_CLIENT_SECRET)
                    ARM_TENANT_ID: $(ARM_TENANT_ID)
                    ARM_SUBSCRIPTION_ID: $(ARM_SUBSCRIPTION_ID)
